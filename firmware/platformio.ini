; Firmware Smart Cart – ESP32 DevKit + PlatformIO (Arduino framework)
;   Wokwi + cầu nối Serial (cách 3): pio run -e esp32dev_sim_bridge  (+ python -m tools.wokwi_bridge)
;   Wokwi + liên kết hệ thống: pio run -e esp32dev_wokwi_online (sửa wokwi.toml trỏ tới env này)
;   Mô phỏng (Wokwi):      pio run -e esp32dev_sim           rồi F1 > Wokwi: Start Simulator
;   Thử phần cứng độc lập: pio run -e esp32dev_standalone -t upload   (không cần mạng/cart_config.h)
;   Chạy cùng hệ thống:    pio run -e esp32dev -t upload              (cần include/cart_config.h – xem README.md)
;   Xem log serial:   pio device monitor
;   Unit test (PC):   pio test -e native                    (hoặc tools/run_native_tests.sh nếu không có PlatformIO)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; Mỗi env dưới đây tự khai báo ĐẦY ĐỦ cờ build (không dùng ${env:...} lồng nhau) để tránh lỗi nội suy.

; Chạy ĐỘC LẬP, không Wi-Fi/MQTT/cart_config.h: thử máy quét, cân, OLED, còi, LED, nút qua Serial trước khi liên kết hệ thống.
[env:esp32dev_standalone]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DSTANDALONE_MODE=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; Dành cho mô phỏng Wokwi (không cần linh kiện): như standalone, tắt đo pin thật, hệ số cân theo Wokwi (~0,42 đếm/gram).
[env:esp32dev_sim]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DSTANDALONE_MODE=1
    -DBATTERY_ENABLED=0
    -DHX711_COUNTS_PER_GRAM=0.42f
lib_deps =
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; Mô phỏng Wokwi + LIÊN KẾT hệ thống qua CẦU NỐI Serial <-> MQTT chạy trên máy bạn (tools/wokwi_bridge.py). Không cần Internet.
[env:esp32dev_sim_bridge]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DSTANDALONE_MODE=1
    -DSERIAL_BRIDGE=1
    -DBATTERY_ENABLED=0
    -DHX711_COUNTS_PER_GRAM=0.42f
lib_deps =
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; Mô phỏng Wokwi + LIÊN KẾT hệ thống thật qua broker MQTT công cộng (Wi-Fi ảo Wokwi-GUEST). Xem include/wokwi_online.h.
[env:esp32dev_wokwi_online]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DWOKWI_ONLINE=1
    -DBATTERY_ENABLED=0
    -DHX711_COUNTS_PER_GRAM=0.42f
lib_deps =
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; Chạy trên máy tính, chỉ biên dịch thư viện lõi lib/cartcore (không có Arduino).
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra
lib_ignore =
    PubSubClient
    HX711
