# Mosquitto 2.x – cấu hình BẢO MẬT (xem docs/SECURITY.md). Dùng với:  docker compose --profile secure up
# File passwd/acl/chứng chỉ do `python -m tools.provision` sinh vào ./secrets và được mount vào container.
persistence false
log_dest stdout

# Chỉ có cổng TLS – không mở 1883 thuần
listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# Bắt buộc đăng nhập + ACL theo từng tài khoản (xe chỉ động vào topic của chính nó)
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
