# Mosquitto 2.x – cấu hình cho môi trường DEV/DEMO (không dùng nguyên trạng cho production).
persistence false
log_dest stdout

# MQTT thuần – Backend & Simulator & ESP32
listener 1883
protocol mqtt

# MQTT over WebSocket – dành cho client trình duyệt nếu cần sau này
listener 9001
protocol websockets

# DEV: cho phép ẩn danh. Production: tắt dòng này và dùng password_file / ACL / TLS.
allow_anonymous true
